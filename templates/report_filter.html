<div class="field"><label for="rf-{{ f.key }}">{{ f.label }}</label>{% if f.choices %}<select id="rf-{{ f.key }}" name="{{ f.key }}"><option value="">All</option>{% for value,label in f.choices %}<option value="{{ value }}" {% if f.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% else %}<input id="rf-{{ f.key }}" name="{{ f.key }}" value="{{ f.value }}">{% endif %}</div>
