{% load tca %}<div class="rail-bands" aria-hidden="true"><span></span><span class="b-c">Certified</span><span class="b-b">Adv.</span><span class="b-a">Show.</span></div>
<ol class="rail-map">{% for row in map.rows %}<li><span class="rail-sec" title="{{ row.title }}">{{ row.number }}</span><span class="rail-cells">{% for c in row.cells %}<a class="cell s-{{ c.state }} l-{{ c.level }}{% if c.current %} is-current{% endif %}" href="{% url 'assessment' site.code %}?assessment={{ map_assessment.pk }}&amp;view=single&amp;page={{ c.page }}" aria-label="{{ c.requirement.label }} {{ c.code|answer_label }}{% if c.current %} (open now){% endif %}" {% if c.current %}aria-current="true"{% endif %}>{% if c.code == 'Y' %}✓{% elif c.code == 'A' %}!{% elif c.code == 'N' %}✕{% endif %}</a>{% endfor %}</span></li>{% endfor %}</ol>
<p class="rail-legend small"><span class="cell s-yes">✓</span> Yes <span class="cell s-advisory">!</span> Advisory <span class="cell s-no">✕</span> No <span class="cell s-unanswered"></span> open</p>
